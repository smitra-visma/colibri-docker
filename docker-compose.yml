# colibri — OpenAI-compatible API server in one command.
#
#   cp .env.example .env   # then set MODEL_DIR
#   docker compose up -d
#
# By default this pulls the prebuilt image from GHCR and falls back to a local
# build if the pull fails. Force a local build with `docker compose build`.
#
#   curl http://localhost:8000/v1/chat/completions \
#     -H 'Content-Type: application/json' \
#     -d '{"model":"glm-5.2","messages":[{"role":"user","content":"Hi"}]}'
#
# The model is bind-mounted read-only from MODEL_DIR on the host. Keep it on a
# local NVMe filesystem, never a network mount: expert streaming is latency
# bound and a remote filesystem makes generation unusably slow.
services:
  colibri:
    build:
      context: .
      args:
        # Pin to a specific upstream commit or tag for reproducible builds.
        COLIBRI_REF: "${COLIBRI_REF:-main}"
        # x86-64-v3 is portable AVX2. Use a specific ISA level for more speed.
        ARCH: "${ARCH:-x86-64-v3}"
    image: "${COLIBRI_IMAGE:-ghcr.io/smitra-visma/colibri-docker:latest}"
    # Pull the published image when it is not already present locally; compose
    # falls back to the build section above when the pull fails, and an explicit
    # `docker compose build` always rebuilds from source.
    pull_policy: "${COLIBRI_PULL_POLICY:-missing}"
    container_name: colibri
    ports:
      - "${COLI_PORT:-8000}:8000"
    volumes:
      - "${MODEL_DIR:?set MODEL_DIR to the directory holding the int4 model}:/model:ro"
    environment:
      # Name reported by /v1/models and expected in the "model" request field.
      COLI_MODEL_ID: "${COLI_MODEL_ID:-glm-5.2}"
      # Optional bearer token. Leave empty to serve without authentication.
      COLI_API_KEY: "${COLI_API_KEY:-}"
      # Extra Host headers accepted by the DNS-rebinding guard, comma separated.
      COLI_ALLOWED_HOSTS: "${COLI_ALLOWED_HOSTS:-}"
      COLI_MAX_QUEUE: "${COLI_MAX_QUEUE:-8}"
      COLI_KV_SLOTS: "${COLI_KV_SLOTS:-1}"
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # RAM budget in GB for the expert cache. 0 lets the engine size it.
      - --ram
      - "${COLI_RAM:-0}"
    healthcheck:
      # /health answers before the model finishes loading, so start_period is
      # generous: a cold 744B load off disk takes minutes.
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
    restart: unless-stopped
    stop_grace_period: 30s
    # Streaming a large MoE model touches a lot of page cache; give it headroom.
    shm_size: "2gb"

  # One-shot downloader: fetches the model straight into MODEL_DIR, so the
  # weights land on the mounted volume and never inside a container layer.
  #
  #   docker compose --profile download run --rm model-download
  #
  # It is safe to re-run: the download resumes from what is already on disk.
  # The mount is read-write here, unlike the read-only mount the server uses.
  model-download:
    image: python:3.12-slim
    profiles: ["download"]
    volumes:
      - "${MODEL_DIR:?set MODEL_DIR to the directory that will hold the model}:/model"
    environment:
      MODEL_REPO: "${MODEL_REPO:-mastouri/GLM-5.2-colibri-int4-g64-with-int8-mtp}"
      # Parallel chunked transfers. Set to 0 if the network dislikes them.
      HF_HUB_ENABLE_HF_TRANSFER: "${HF_HUB_ENABLE_HF_TRANSFER:-1}"
      # Only needed for a gated or private repository.
      HF_TOKEN: "${HF_TOKEN:-}"
      # Keep the resume metadata next to the weights, not in the container.
      HF_HOME: /model/.hf-home
    working_dir: /model
    entrypoint: ["sh", "-eu", "-c"]
    command:
      - |
        pip install --no-cache-dir --quiet "huggingface_hub[cli,hf_transfer]"
        echo "downloading $${MODEL_REPO} into $${PWD}"
        hf download "$${MODEL_REPO}" --local-dir /model
    restart: "no"

  # Browsable API reference for the endpoints above. Started only on demand:
  #   docker compose --profile docs up -d
  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    container_name: colibri-docs
    profiles: ["docs"]
    ports:
      - "${DOCS_PORT:-8080}:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/spec/openapi.yaml:ro
    restart: unless-stopped
